<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OG Images Preview — ImgSwift</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg: #080810;
    --surface: #0f0f1a;
    --border: #1e1e2e;
    --text: #e2e2f0;
    --muted: #6b6b8a;
    --accent: #7c3aed;
  }
  
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
  }

  /* Grid texture */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(124,58,237,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,58,237,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none; z-index: 0;
  }

  .wrap { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 48px 24px; }

  header {
    display: flex; align-items: baseline; gap: 16px;
    margin-bottom: 12px;
  }
  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 800;
    background: linear-gradient(135deg, #7c3aed, #c084fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .badge {
    background: rgba(124,58,237,0.18);
    border: 1px solid rgba(124,58,237,0.35);
    color: #c084fc;
    font-size: 0.62rem;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.8rem;
    margin-bottom: 40px;
    letter-spacing: 0.05em;
  }

  /* Filter bar */
  .filter-bar {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 32px;
  }
  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 14px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: #c084fc;
    background: rgba(124,58,237,0.1);
  }

  /* Grid */
  .og-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 24px;
  }

  .og-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
  }
  .og-card:hover {
    border-color: rgba(124,58,237,0.5);
    transform: translateY(-2px);
  }

  .og-card-preview {
    width: 100%;
    aspect-ratio: 1200 / 630;
    display: block;
    background: #0a0a10;
  }

  .og-card-meta {
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px;
  }
  .og-card-key {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }
  .og-card-label {
    font-size: 0.75rem;
    color: var(--text);
    font-weight: 500;
  }

  .download-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    padding: 5px 12px;
    cursor: pointer;
    border-radius: 4px;
    letter-spacing: 0.08em;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .download-btn:hover {
    border-color: #c084fc;
    color: #c084fc;
  }

  /* Loading */
  .loading-bar {
    height: 2px;
    background: linear-gradient(90deg, #7c3aed, #c084fc, #7c3aed);
    background-size: 200% 100%;
    animation: loadSlide 1.2s ease infinite;
    border-radius: 2px;
    margin-bottom: 32px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .loading-bar.active { opacity: 1; }
  @keyframes loadSlide {
    0%   { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }

  .stats-row {
    display: flex; gap: 24px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .stat-item {
    display: flex; flex-direction: column; gap: 2px;
  }
  .stat-val {
    font-family: 'Syne', sans-serif;
    font-size: 1.4rem;
    font-weight: 800;
    color: #c084fc;
  }
  .stat-lbl {
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .accent-dot { 
    display: inline-block; 
    width: 8px; height: 8px; 
    border-radius: 50%; 
    margin-right: 8px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>OG Images</h1>
    <span class="badge">Dynamic · Canvas</span>
  </header>
  <p class="subtitle">// Dynamic Open Graph images generated per tool — 1200 × 630 px</p>

  <div class="loading-bar" id="loadingBar"></div>

  <div class="stats-row">
    <div class="stat-item">
      <span class="stat-val" id="totalCount">0</span>
      <span class="stat-lbl">Total Tools</span>
    </div>
    <div class="stat-item">
      <span class="stat-val" id="renderedCount">0</span>
      <span class="stat-lbl">Rendered</span>
    </div>
    <div class="stat-item">
      <span class="stat-val">1200×630</span>
      <span class="stat-lbl">OG Size</span>
    </div>
    <div class="stat-item">
      <span class="stat-val">Canvas API</span>
      <span class="stat-lbl">Engine</span>
    </div>
  </div>

  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">All</button>
  </div>

  <div class="og-grid" id="ogGrid"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════
   SEO DATA — same as seo-pages.js
═══════════════════════════════════════════════════ */
const SEO = {
  'jpg-png':   { label:'JPG → PNG',      icon:'🖼️', accent:'#f97316', bg:'#1a0a00' },
  'jpg-webp':  { label:'JPG → WebP',     icon:'⚡', accent:'#3b82f6', bg:'#000d1a' },
  'jpg-pdf':   { label:'JPG → PDF',      icon:'📄', accent:'#ef4444', bg:'#1a0000' },
  'png-jpg':   { label:'PNG → JPG',      icon:'🖼️', accent:'#8b5cf6', bg:'#0d0014' },
  'png-webp':  { label:'PNG → WebP',     icon:'⚡', accent:'#06b6d4', bg:'#001214' },
  'png-pdf':   { label:'PNG → PDF',      icon:'📄', accent:'#10b981', bg:'#001209' },
  'webp-jpg':  { label:'WebP → JPG',     icon:'🔄', accent:'#f59e0b', bg:'#140900' },
  'webp-png':  { label:'WebP → PNG',     icon:'🔄', accent:'#a78bfa', bg:'#0c0014' },
  'compress':  { label:'Compress Image', icon:'🗜️', accent:'#22c55e', bg:'#001a08' },
  'pdf-img':   { label:'PDF → Image',    icon:'📑', accent:'#f43f5e', bg:'#1a0008' },
  'ocr':       { label:'Image OCR',      icon:'🔍', accent:'#eab308', bg:'#141000' },
  'bgremove':  { label:'Remove BG',      icon:'✂️', accent:'#ec4899', bg:'#1a0010' },
  'watermark': { label:'Add Watermark',  icon:'🔏', accent:'#6366f1', bg:'#06001a' },
  'resize':    { label:'Resize Image',   icon:'↔️', accent:'#0ea5e9', bg:'#001219' },
  'metadata':  { label:'View Metadata',  icon:'🔬', accent:'#14b8a6', bg:'#001413' },
  'rotate':    { label:'Rotate Image',   icon:'🔄', accent:'#f97316', bg:'#1a0800' },
  'flip':      { label:'Flip Image',     icon:'↔️', accent:'#a855f7', bg:'#0e0019' },
  'crop':      { label:'Crop Image',     icon:'✂️', accent:'#f43f5e', bg:'#190006' },
  'exif':      { label:'Remove EXIF',    icon:'🧹', accent:'#ef4444', bg:'#1a0000' },
};

/* ═══════════════════════════════════════════════════
   OG IMAGE GENERATOR
═══════════════════════════════════════════════════ */
function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function generateOgImage(seo) {
  const canvas = document.createElement('canvas');
  canvas.width = 1200; canvas.height = 630;
  const ctx = canvas.getContext('2d');
  const W = 1200, H = 630;

  // Background
  ctx.fillStyle = seo.bg || '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  // Radial glow left
  const grd = ctx.createRadialGradient(200, H/2, 0, 200, H/2, 500);
  grd.addColorStop(0, hexAlpha(seo.accent, 0.18));
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);

  // Border
  ctx.strokeStyle = hexAlpha(seo.accent, 0.25);
  ctx.lineWidth = 1.5;
  ctx.strokeRect(28, 28, W-56, H-56);

  // Grid lines
  ctx.strokeStyle = hexAlpha(seo.accent, 0.1);
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const y = 90 + i * 90;
    ctx.beginPath(); ctx.moveTo(60,y); ctx.lineTo(W-60,y); ctx.stroke();
  }

  // Dots
  for (let i = 0; i < 30; i++) {
    ctx.beginPath();
    ctx.arc(60 + (i%10)*115, 60 + Math.floor(i/10)*260, 1.5, 0, Math.PI*2);
    ctx.fillStyle = hexAlpha(seo.accent, 0.15); ctx.fill();
  }

  // Brand
  ctx.font = 'bold 22px monospace';
  ctx.fillStyle = hexAlpha('#ffffff', 0.4);
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillText('⚡ imgswift.xyz', 60, 52);

  // Icon
  ctx.font = '110px serif';
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText(seo.icon, 60, H/2 - 40);

  // Label
  const fs = seo.label.length > 14 ? 58 : seo.label.length > 10 ? 68 : 80;
  ctx.font = `bold ${fs}px sans-serif`;
  ctx.fillStyle = seo.accent;
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(seo.label, 60, H/2 + 80);

  // Desc
  ctx.font = 'bold 28px sans-serif';
  ctx.fillStyle = hexAlpha('#ffffff', 0.55);
  ctx.fillText('Free · Online · No Upload', 62, H/2 + 128);

  // Bottom line
  const gl = ctx.createLinearGradient(60, 0, W-60, 0);
  gl.addColorStop(0, seo.accent);
  gl.addColorStop(1, hexAlpha(seo.accent, 0));
  ctx.fillStyle = gl;
  ctx.fillRect(60, H-60, W-120, 3);

  // Right decorative circle
  const cx = W-200, cy = H/2;
  const cg = ctx.createRadialGradient(cx,cy,80,cx,cy,200);
  cg.addColorStop(0, hexAlpha(seo.accent, 0.08));
  cg.addColorStop(0.7, hexAlpha(seo.accent, 0.05));
  cg.addColorStop(1, 'transparent');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(cx,cy,200,0,Math.PI*2); ctx.fill();

  [180,140,100].forEach((r,i) => {
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle = hexAlpha(seo.accent, 0.08 + i*0.04);
    ctx.lineWidth = 1; ctx.stroke();
  });

  ctx.font = '72px serif'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  ctx.globalAlpha = 0.4;
  ctx.fillText(seo.icon, cx, cy);
  ctx.globalAlpha = 1;

  return canvas;
}

/* ═══════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════ */
const grid   = document.getElementById('ogGrid');
const bar    = document.getElementById('loadingBar');
const keys   = Object.keys(SEO);
let rendered = 0;
let activeFilter = 'all';

document.getElementById('totalCount').textContent = keys.length;
bar.classList.add('active');

// Build filter buttons
const categories = {
  'Convert': ['jpg-png','jpg-webp','png-jpg','png-webp','webp-jpg','webp-png'],
  'PDF':     ['jpg-pdf','png-pdf','pdf-img'],
  'Edit':    ['watermark','rotate','flip','crop','resize'],
  'Tools':   ['compress','ocr','bgremove','metadata','exif'],
};
Object.keys(categories).forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.dataset.filter = cat;
  btn.textContent = cat;
  btn.onclick = () => setFilter(cat, btn);
  document.getElementById('filterBar').appendChild(btn);
});

function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.og-card').forEach(card => {
    if (f === 'all') { card.style.display = ''; return; }
    const inCat = (categories[f] || []).includes(card.dataset.key);
    card.style.display = inCat ? '' : 'none';
  });
}

// Generate all cards asynchronously
async function renderAll() {
  for (const key of keys) {
    const seo = SEO[key];

    // Card shell
    const card = document.createElement('div');
    card.className = 'og-card';
    card.dataset.key = key;

    const img = document.createElement('img');
    img.className = 'og-card-preview';
    img.alt = seo.label;

    const meta = document.createElement('div');
    meta.className = 'og-card-meta';
    meta.innerHTML = `
      <div>
        <div class="og-card-label">
          <span class="accent-dot" style="background:${seo.accent}"></span>${seo.label}
        </div>
        <div class="og-card-key">${key}</div>
      </div>
      <button class="download-btn" data-key="${key}">↓ PNG</button>
    `;

    card.appendChild(img);
    card.appendChild(meta);
    grid.appendChild(card);

    // Generate asynchronously with a small delay to avoid blocking
    await new Promise(r => setTimeout(r, 16));
    const canvas = generateOgImage(seo);
    img.src = canvas.toDataURL('image/png');

    // Download button
    meta.querySelector('.download-btn').onclick = () => {
      const a = document.createElement('a');
      a.download = `og-${key}.png`;
      a.href = img.src;
      a.click();
    };

    rendered++;
    document.getElementById('renderedCount').textContent = rendered;

    if (rendered === keys.length) {
      bar.classList.remove('active');
    }
  }
}

renderAll();
</script>
</body>
</html>
